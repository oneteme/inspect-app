<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="30px" height="30px" viewBox="0 0 30 30">
  <defs>
    <filter id="callerShadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#00000035"/>
    </filter>
    <radialGradient id="orbGlow" cx="40%" cy="35%" r="60%">
      <stop offset="0%"  stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g filter="url(#callerShadow2)">
    <!-- Outer hexagon — tech feel -->
    <polygon points="15,2 26.3,8.5 26.3,21.5 15,28 3.7,21.5 3.7,8.5"
             fill="#475569" stroke="#334155" stroke-width="0.8" stroke-linejoin="round"/>
    <!-- Inner glow -->
    <circle cx="15" cy="15" r="10" fill="url(#orbGlow)" stroke="none"/>

    <!-- Arrow pointing down — centered -->
    <path d="M 15 10 L 15 20 M 12.5 17.5 L 15 21 L 17.5 17.5"
          fill="none" stroke="#0ea5e9" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
