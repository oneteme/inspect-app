<nav class="navbar">
  <div class="navbar-glow"></div>

  <div class="navbar-content">
    <div class="nav-brand" (click)="gotoHome($event)">
      
      <svg class="nav-brand-logo" xmlns="http://www.w3.org/2000/svg" viewBox="70 35 450 140">
  <defs>
    <!-- Dégradé bleu télémétrie -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Filtre lumineux / néon intense uniquement pour le texte JARVIS -->
    <filter id="jarvisGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="glassShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
  </defs>

  <style>
    .wordmark {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 92px;
      fill: #0F172A;
      letter-spacing: 3px;
    }

    /* Style lumineux et sophistiqué pour JARVIS */
    .jarvis-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 20px;
      fill: #38BDF8; /* Cyan lumineux */
      letter-spacing: 12px;
      text-transform: uppercase;
    }

    /* --- ANIMATIONS --- */
    @keyframes fadeInScale {
      0% { opacity: 0; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes drawWave {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes slideFromLeft {
      0% { opacity: 0; transform: translateX(-30px); }
      100% { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideFromRight {
      0% { opacity: 0; transform: translateX(30px); }
      100% { opacity: 1; transform: translateX(0); }
    }
    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .anim-loupe {
      animation: fadeInScale 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transform-origin: 275px 92px;
    }
    .anim-wave {
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: drawWave 0.8s ease-in-out 0.4s forwards;
    }
    .anim-ins {
      opacity: 0;
      animation: slideFromLeft 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
    }
    .anim-ect {
      opacity: 0;
      animation: slideFromRight 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
    }
    .anim-tagline {
      opacity: 0;
      animation: fadeIn 0.8s ease-out 0.8s forwards;
    }
  </style>

  <!-- Groupe principal du logo -->
  <g transform="translate(10, 10)">
    
    <!-- Partie : "INS" -->
    <g class="anim-ins">
      <text x="65" y="128" class="wordmark">INS</text>
    </g>

    <!-- Le "P" / Loupe fixe -->
    <g class="anim-loupe" filter="url(#glassShadow)">
      <g transform="translate(275, 92)">
        <circle cx="0" cy="0" r="36" fill="#F0F9FF" />
        
        <line x1="-22" y1="-12" x2="22" y2="-12" stroke="#BAE6FD" stroke-width="1" />
        <line x1="-26" y1="0" x2="26" y2="0" stroke="#BAE6FD" stroke-width="1" />
        <line x1="-22" y1="12" x2="22" y2="12" stroke="#BAE6FD" stroke-width="1" />

        <polyline points="-22,6 -10,6 -4,-10 5,12 13,-4 22,-4" fill="none" stroke="url(#accentGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" class="anim-wave" />
        <circle cx="22" cy="-4" r="3.5" fill="#0284C7" />

        <circle cx="0" cy="0" r="36" fill="none" stroke="#0F172A" stroke-width="11" />
        <path d="M -23 -15 A 27 27 0 0 1 16 -22" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />

        <line x1="-23" y1="29" x2="-46" y2="62" stroke="#0F172A" stroke-width="13" stroke-linecap="round" />
        <line x1="-32" y1="42" x2="-42" y2="56" stroke="#0EA5E9" stroke-width="5" stroke-linecap="round" />
      </g>
    </g>

    <!-- Partie : "ECT" -->
    <g class="anim-ect">
      <text x="330" y="128" class="wordmark">ECT</text>
    </g>

    <!-- Texte JARVIS épuré avec l'effet lumineux exclusif -->
    <text x="320" y="155" text-anchor="middle" class="jarvis-text anim-tagline" filter="url(#jarvisGlow)">
      JARVIS
    </text>
  </g>
</svg>

    </div>

    <div class="nav-main">
      <div class="nav-divider"></div>
      <button class="menu-trigger" [matMenuTriggerFor]="mainMenu" #mainTrigger="matMenuTrigger">
        <mat-icon>menu</mat-icon>
      </button>
      <mat-menu #mainMenu="matMenu" class="main-nav-menu">
        <ng-container *ngFor="let item of navItems">
          <button
             mat-menu-item
             class="inspect-track-target"
            *ngIf="item.children"
            [matMenuTriggerFor]="subMenu"
            [attr.data-inspect-location]="(pageTitle$ | async)?.title || 'Navigation'"
            data-inspect-scope="Menu principal"
            [attr.data-inspect-track]="item.label"
          >
            <mat-icon class="material-symbols-outlined">{{ item.icon }}</mat-icon>
            <span>{{ item.label }}</span>
          </button>

          <mat-menu #subMenu="matMenu" class="sub-nav-menu">
            <button
              mat-menu-item
              class="nav-item-with-kpi inspect-track-target"
              *ngFor="let subItem of item.children"
              [attr.data-inspect-location]="(pageTitle$ | async)?.title || 'Navigation'"
              data-inspect-scope="Menu principal"
              [attr.data-inspect-track]="item.id === 'request' ? item.label + ' ' + subItem.label : subItem.label"
              (click)="navigateToSub($event, item, subItem)">
              <mat-icon class="material-symbols-outlined">{{ subItem.icon }}</mat-icon>
              <span>{{ subItem.label }}</span>
              <span
                *ngIf="subItem.kpiRoute"
                class="nav-kpi-btn"
                [attr.data-inspect-location]="(pageTitle$ | async)?.title || 'Navigation'"
                data-inspect-scope="Menu principal"
                [attr.data-inspect-track]="'KPI '+ subItem.label"
                (click)="$event.stopPropagation(); navigateToKpi($event, subItem.kpiRoute)"
                [matTooltip]="'KPI'"
                matTooltipPosition="right"
              >
                <mat-icon class="material-symbols-outlined">finance_mode</mat-icon>
              </span>
            </button>
          </mat-menu>

          <button
            mat-menu-item
            class="nav-item-with-kpi"
            *ngIf="!item.children"
            [attr.data-inspect-location]="(pageTitle$ | async)?.title || 'Navigation'"
            data-inspect-scope="Menu principal"
            [attr.data-inspect-track]="item.label"
            (click)="navigateTo($event, item.route)"
          >
            <mat-icon class="material-symbols-outlined">{{ item.icon }}</mat-icon>
            <span>{{ item.label }}</span>
            <span
              *ngIf="item.kpiRoute"
              class="nav-kpi-btn"
              [attr.data-inspect-location]="(pageTitle$ | async)?.title || 'Navigation'"
              data-inspect-scope="Menu principal"
              [attr.data-inspect-track]="'KPI ' + item.label"
              (click)="$event.stopPropagation(); navigateToKpi($event, item.kpiRoute)"
              [matTooltip]="'KPI'"
              matTooltipPosition="right">
                <mat-icon class="material-symbols-outlined">finance_mode</mat-icon>
              </span>
          </button>
        </ng-container>
      </mat-menu>

      <ng-container *ngIf="pageTitle$ | async as pt">
        <div class="nav-page-title">
          <mat-icon class="npt-icon" [ngClass]="{'material-symbols-outlined': pt.iconOutlined}">{{ pt.icon }}</mat-icon>
          <div class="npt-text">
            <div class="npt-top-row">
              <span class="npt-label">{{ pt.title }}</span>
            </div>
            <span class="npt-sub" *ngIf="pt.subtitle">{{ pt.subtitle }}</span>
          </div>
        </div>
      </ng-container>

      <ng-container *ngIf="hasPanel$ | async">
        <div class="nav-filter-group">
          <button *ngIf="periodLabel$ | async as label"
                  class="nav-period-badge"
                  [class.nav-period-badge--open]="isPanelOpen$ | async"
                  (click)="onFilterClick()"
                  [matTooltip]="(isPanelOpen$ | async) ? 'Masquer les filtres' : 'Afficher les filtres'">
            <span class="npb-label">{{ label }}</span>
          </button>
          <button class="nav-filter-btn"
                  [class.nav-filter-btn--open]="isPanelOpen$ | async"
                  (click)="onFilterClick()"
                  [matTooltip]="(isPanelOpen$ | async) ? 'Masquer les filtres' : 'Afficher les filtres'">
            <mat-icon class="nfb-icon material-symbols-outlined">filter_list</mat-icon>
            <mat-icon class="nfb-chevron">expand_more</mat-icon>
          </button>
        </div>
      </ng-container>

    </div>

    <div class="nav-actions">
      <div class="nav-divider"></div>

        <button class="env-trigger inspect-track-target" [matMenuTriggerFor]="envMenu" [ngClass]="'env-' + getEnvClass(namespace.value)" matTooltip="Changer l'environnement">
            <span class="env-letter">{{ namespace.value?.charAt(0) | uppercase }}</span>
            <span class="env-label">{{ namespace.value | uppercase }}</span>
            <mat-icon>expand_more</mat-icon>
            <mat-spinner *ngIf="isLoadingNamespace" [diameter]="14"></mat-spinner>
        </button>

        <mat-menu #envMenu="matMenu" class="env-menu-panel">
            <button mat-menu-item class="inspect-track-target" *ngFor="let e of namespaces" (click)="selectNamespace(e)"
                    [attr.data-inspect-location]="(pageTitle$ | async)?.title || 'Navigation'"
                    data-inspect-scope="Namespace"
                    [attr.data-inspect-track]="e">
                <mat-icon [style.visibility]="namespace.value === e ? 'visible' : 'hidden'">check</mat-icon>
                <span>{{ e | uppercase }}</span>
            </button>
            <button mat-menu-item class="inspect-track-target" (click)="openAddNamespaceDialog()" *ngIf="auth.enabled"
                    [attr.data-inspect-location]="(pageTitle$ | async)?.title || 'Navigation'"
                    data-inspect-scope="Namespace"
                    data-inspect-track="Ajouter un namespace">
                <mat-icon class="material-symbols-outlined">add</mat-icon>
                <span>Ajouter</span>
            </button>
        </mat-menu>

      <button class="user-btn"
             [matMenuTriggerFor]="userMenu"
             [attr.data-inspect-location]="(pageTitle$ | async)?.title || 'Navigation'"
             data-inspect-scope="Afficher les actions du menu utilisateur"
             data-inspect-track="Menu utilisateur"
             matTooltip="Profil utilisateur">
        <span class="user-name">{{ getUserDisplayName() }}</span>
      </button>

      <mat-menu #userMenu="matMenu" class="user-menu-panel" xPosition="before">
        <div class="user-menu-header" (click)="$event.stopPropagation()">
          <div class="user-menu-avatar">{{ getUserInitials() }}</div>
          <div class="user-menu-info">
            <span class="user-menu-name">{{ getUserDisplayName() }}</span>
            <span class="user-menu-email">{{ getUserEmail() }}</span>
          </div>
        </div>
        <div class="user-menu-divider"></div>
        <button mat-menu-item class="user-menu-item"
                [attr.data-inspect-location]="(pageTitle$ | async)?.title || 'Navigation'"
                data-inspect-scope="Consulter les traitements, les pertes de séquences et les rapports du serveur"
                data-inspect-track="Le diagnostic"
                (click)="openServerActivity($event)">
          <mat-icon class="material-symbols-outlined">troubleshoot</mat-icon>
          <span>Diagnostic</span>
        </button>
        <button mat-menu-item class="logout-item" (click)="logout()"
                [attr.data-inspect-location]="(pageTitle$ | async)?.title || 'Navigation'"
                data-inspect-scope="Terminer la session utilisateur"
                data-inspect-track="Se déconnecter">
          <mat-icon class="material-symbols-outlined">logout</mat-icon>
          <span>Se déconnecter</span>
        </button>
      </mat-menu>


        <!-- <button class="action-btn about-btn" (click)="openAbout()" matTooltip="À propos" aria-label="À propos">
          <mat-icon>info_outline</mat-icon>
        </button> -->
      <a
        class="action-btn github-btn"
        href="https://github.com/orgs/oneteme/projects/45"
        target="_blank"
        matTooltip="Contribuer sur GitHub"
        [attr.data-inspect-location]="(pageTitle$ | async)?.title || 'Navigation'"
        data-inspect-scope="Consulter le projet GitHub pour contribuer"
        data-inspect-track="Ouvrir GitHub"
      >
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
        </svg>
      </a>
    </div>
  </div>
</nav>
