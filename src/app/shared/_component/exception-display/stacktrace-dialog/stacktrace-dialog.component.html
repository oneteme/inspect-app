<div class="modal">

  <div class="modal-header">
    <div class="modal-header-left">
      <div class="modal-icon">
        <mat-icon>warning_amber</mat-icon>
      </div>
      <div class="modal-info">
        <div class="modal-title">
          Exception
        </div>
        <div class="modal-subtitle">
          {{ data.type }}
        </div>
      </div>
    </div>
    <button class="modal-close" mat-dialog-close>
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="modal-body">
    <pre><code><ng-container *ngFor="let line of stacktraceLines"><span class="stacktrace-line" *ngIf="!line.hiddenFrames">{{ line.text }}</span><ng-container *ngIf="line.hiddenFrames"><button type="button" class="stacktrace-more" [attr.aria-expanded]="line.expanded" (click)="toggleFrames(line)">{{ line.text }}</button><ng-container *ngIf="line.expanded"><span class="stacktrace-line" *ngFor="let frame of line.hiddenFrames">{{ frame }}</span></ng-container></ng-container></ng-container></code></pre>
  </div>

</div>
