<!-- Bandeau horizontal fixe sous la navbar -->
<section class="pp-bar"
     [class.pp-bar--open]="isOpen$ | async"
     (mouseenter)="onPanelEnter()"
     (mouseleave)="onPanelLeave()"
     aria-label="Filtres"
     [attr.aria-hidden]="!(isOpen$ | async)">
  <div class="pp-body" (click)="onBodyClick($event)">
    <ng-content></ng-content>
  </div>
</section>
