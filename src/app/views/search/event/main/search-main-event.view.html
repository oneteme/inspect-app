<jquery-table class="flex-table"
              [config]="tableConfig"
              [data]="events"
              [isLoading]="isLoading">

    <ng-template jqtCellDef="instant" let-row>
        {{ (row.instant*1000 | date:'dd/MM/yyyy')}}
        <br>
        {{ (row.instant*1000 | date:'HH:mm:ss.SSS')}}
    </ng-template>
</jquery-table>
