<div class="modal">
    <div class="modal-header">
        <div class="modal-header-left">
            <div class="modal-info">
                <div class="modal-title">Informations de la base de données</div>
            </div>
        </div>
        <button class="modal-close" mat-dialog-close>
            <mat-icon>close</mat-icon>
        </button>
    </div>
    <div class="modal-body">
        <div class="table-wrapper" *ngIf="tables?.length; else empty">
            <table class="database-table">
                <thead>
                <tr>
                    <th>Nom de la table</th>
                    <th>Volume</th>
                </tr>
                </thead>
                <tbody>
                <tr *ngFor="let table of tables">
                    <td>{{ table.table_name }}</td>
                    <td>{{ table.size }}</td>
                </tr>
                </tbody>
            </table>
        </div>
        <ng-template #empty>
            <div class="empty-state">{{ isLoading ? 'Chargement...' : 'Aucune table trouvée' }}</div>
        </ng-template>
    </div>
</div>
