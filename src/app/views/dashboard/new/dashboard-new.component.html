<page-panel panelTitle="Filtres">
  <form class="panel-filter">
    <app-period-date-range [formGroup]="periodFilterForm"></app-period-date-range>
    <div class="pp-actions">
      <button mat-mini-fab color="primary" (click)="search($event)">
        <mat-icon matSuffix>search</mat-icon>
      </button>
    </div>
  </form>
</page-panel>

<div class="db-grid">
  <aside class="db-sidebar">
    <div class="dov-stats-wrap">
      <div class="dov-stats-lbl">
        Instances actives
        <mat-icon class="dov-stats-lbl-info material-symbols-outlined" title="Les instances actives ne dépendent pas de la période sélectionnée">info</mat-icon>
      </div>
      <div class="dov-stats-sidebar">
        <button type="button" class="dov-stat-sb sb-total"
                [attr.data-inspect-location]="MAPPING_TYPE['deploiment'].title + ' • ' + MAPPING_TYPE['dashboard'].title"
                data-inspect-scope="Menu latéral"
                data-inspect-track="Total des instances actives">
          <span class="dov-stat-sb-val">--</span>
          <span class="dov-stat-sb-lbl">Total</span>
        </button>
        <button type="button" class="dov-stat-sb sb-pending"
                [attr.data-inspect-location]="MAPPING_TYPE['deploiment'].title + ' • ' + MAPPING_TYPE['dashboard'].title"
                data-inspect-scope="Menu latéral"
                data-inspect-track="Instances actives en attente">
          <span class="dov-stat-sb-val">--</span>
          <span class="dov-stat-sb-lbl">En attente</span>
        </button>
        <button type="button" class="dov-stat-sb sb-offline"
                [attr.data-inspect-location]="MAPPING_TYPE['deploiment'].title + ' • ' + MAPPING_TYPE['dashboard'].title"
                data-inspect-scope="Menu latéral"
                data-inspect-track="Instances actives hors ligne">
          <span class="dov-stat-sb-val">--</span>
          <span class="dov-stat-sb-lbl">Hors ligne</span>
        </button>
      </div>
    </div>
    <ng-container *ngFor="let s of summaries">
      <div class="sb-block sb-distribution-block">
        <div class="sbd-title">{{ s.label }}</div>
        <div class="sbd-empty" *ngIf="s.hasNoData">
          <mat-icon>info_outline</mat-icon>
          <span>Aucun traitement sur la période</span>
        </div>
        <ng-container *ngFor="let sub of s.subSummaries">
          <ng-container *ngIf="sub.isLoading && sub.countTotal == 0; else sessionBlock">
            <div class="sbd-skel-main">
              <div class="sbd-skel-top">
                <div class="sbd-skel-label"></div>
                <div class="sbd-skel-count"></div>
              </div>
              <div class="sbd-skel-track"></div>
            </div>
            <div class="sbd-skel-rate"></div>
          </ng-container>
          <ng-template #sessionBlock>
            <div class="sbd-row" *ngIf="sub.countTotal > 0"
                 [class.sbd-row-selected]="selectedSummary.category === s.category && selectedSummary.type === sub.type"
                 [class.sbd-row-clickable]="true"
                 [title]="(sub.countTotal | number: '1.0-0') + ' sessions · ' + (sub.countError | number: '1.0-0') + ' erreurs'"
                 tabindex="0"
                 (click)="onClickSummary(s.category, sub)"
                 (keydown.enter)="onClickSummary(s.category, sub)">
              <div class="sbd-main"
                   [attr.data-inspect-location]="s.label + ' • ' + MAPPING_TYPE['dashboard'].title"
                   data-inspect-scope="Menu latéral"
                   [attr.data-inspect-track]="'Taux ' + sub.label">
                <div class="sbd-top">
                  <span class="sbd-label">{{ sub.label }}</span>
                  <span class="sbd-count">{{ sub.countTotal | compact }}</span>
                </div>
                <div class="sbd-track sbd-track-split">
                  <div class="sbd-fill-success" [style.width.%]="((sub.countTotal - (sub.countError + sub.countWarn)) * 100) / sub.countTotal"></div>
                  <div class="sbd-fill-warn" [style.width.%]="(sub.countWarn * 100) / sub.countTotal"></div>
                  <div class="sbd-fill-error" [style.width.%]="(sub.countError * 100) / sub.countTotal"></div>
                </div>
              </div>
              <span class="sbd-rate" [class.c-ok]="sub.countTotal > 0 && (sub.countError * 100) / sub.countTotal === 0" [class.c-err]="(sub.countError * 100) / sub.countTotal > 0"
                    [attr.data-inspect-location]="s.label + ' • ' + MAPPING_TYPE['dashboard'].title"
                    data-inspect-scope="Menu latéral"
                    [attr.data-inspect-track]="'Taux ' + sub.label">{{ (sub.countError * 100) / sub.countTotal === 0 ? '100%' : ((sub.countError * 100) / sub.countTotal | number:'1.2-2') + '%' }}</span>
            </div>
          </ng-template>
        </ng-container>
      </div>
    </ng-container>
  </aside>
  <section class="db-main">
    <dashboard-detail-view-new
        [isLoading]="isSummaryLoading"
        [selectedSummary]="selectedSummary"
        (onNavigateSearch)="onNavigateSearch($event.event, $event.row)"></dashboard-detail-view-new>
  </section>
</div>
