<page-panel panelTitle="Filtres">
  <form class="panel-filter">
    <div class="period-filter-wrapper">
      <mat-form-field class="no-subscript period-wide period-field"
                      [style.--period-field-width]="isDefaultPeriod() ? '372px' : '408px'"
                      appearance="outline">
        <mat-label>Période</mat-label>
        <mat-date-range-input [formGroup]="periodFilterForm" [rangePicker]="picker">
          <input matStartDate formControlName="start" placeholder="Start date" (dateChange)="onChangeStart($event)">
          <input matEndDate formControlName="end" placeholder="End date" (dateChange)="onChangeEnd($event)">
        </mat-date-range-input>
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <span matSuffix class="period-inline-separator" aria-hidden="true"></span>
        <button mat-icon-button
                matSuffix
                type="button"
                [matMenuTriggerFor]="quickRangesMenu"
                matTooltip="Plages de temps rapides"
                class="period-action-btn">
          <mat-icon class="material-symbols-outlined">schedule</mat-icon>
        </button>
        <button *ngIf="!isDefaultPeriod()"
                mat-icon-button
                matSuffix
                type="button"
                matTooltip="Réinitialiser à la date du jour"
                (click)="resetPeriod()"
                class="period-action-btn">
          <mat-icon class="material-symbols-outlined">restart_alt</mat-icon>
        </button>
        <mat-date-range-picker #picker></mat-date-range-picker>
      </mat-form-field>
      <mat-menu #quickRangesMenu="matMenu" class="period-quick-ranges-menu">
        <button *ngFor="let quickRange of periodQuickRanges" mat-menu-item (click)="applyQuickRange(quickRange.value)">
          <span>{{ quickRange.label }}</span>
        </button>
      </mat-menu>
    </div>

    <div class="pp-actions">
      <button mat-mini-fab color="primary" (click)="search()">
        <mat-icon matSuffix>search</mat-icon>
      </button>
    </div>
  </form>
</page-panel>
