<app-timeline *ngIf="instance && request"
                  [options]="options"
                  [groups]="dataGroups"
                  [items]="dataItems"
                  (onTimelineCreated)="onTimelineCreate($event)"
                  (onItemCLicked)="onItemCLicked($event)">
  <div class="legend">
    <div class="legend-chips">
      <div *ngIf="request.restRequests?.length" class="chip api"
           [class.inactive]="!isFilterActive('rest')"
           (click)="toggleFilter('rest')">
        <span class="chip-dot"></span>HTTP
      </div>
      <div *ngIf="request.ftpRequests?.length" class="chip ftp"
           [class.inactive]="!isFilterActive('ftp')"
           (click)="toggleFilter('ftp')">
        <span class="chip-dot"></span>FTP
      </div>
      <div *ngIf="request.mailRequests?.length" class="chip smtp"
           [class.inactive]="!isFilterActive('smtp')"
           (click)="toggleFilter('smtp')">
        <span class="chip-dot"></span>SMTP
      </div>
      <div *ngIf="request.ldapRequests?.length" class="chip ldap"
           [class.inactive]="!isFilterActive('ldap')"
           (click)="toggleFilter('ldap')">
        <span class="chip-dot"></span>LDAP
      </div>
      <div *ngIf="request.databaseRequests?.length" class="chip bdd"
           [class.inactive]="!isFilterActive('jdbc')"
           (click)="toggleFilter('jdbc')">
        <span class="chip-dot"></span>JDBC
      </div>
      <div *ngIf="request.localRequests?.length" class="chip local"
           [class.inactive]="!isFilterActive('local')"
           (click)="toggleFilter('local')">
        <span class="chip-dot"></span>LOCAL
      </div>
      <div *ngIf="request['userActions']?.length" class="chip action"
           [class.inactive]="!isFilterActive('action')"
           (click)="toggleFilter('action')">
        <span class="chip-dot"></span>Action
      </div>
      <div *ngIf="request['sessionEvents']?.length" class="chip event"
          [class.inactive]="!isFilterActive('event')"
          (click)="toggleFilter('event')">
      <span class="chip-dot"></span>EVENT
    </div>
    </div>
    <div class="timeline-search">
      <mat-icon class="material-symbols-outlined">search</mat-icon>
      <input type="search"
             [ngModel]="searchTerm"
             (ngModelChange)="updateSearchTerm($event)"
             placeholder="Filtrer..."
             aria-label="Filtrer les éléments de la timeline"
             autocomplete="off">
      <button *ngIf="searchTerm"
              type="button"
              class="timeline-search-clear"
              (click)="clearSearch()"
              aria-label="Effacer le filtre">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <button type="button"
            mat-icon-button
            class="group-menu-trigger"
            [class.grouping-active]="groupBy !== 'threadName'"
            [matMenuTriggerFor]="timelineMenu"
            matTooltip="Timeline settings"
            aria-label="Timeline settings">
      <mat-icon>settings</mat-icon>
    </button>
    <mat-menu #timelineMenu="matMenu" class="card-menu">
      <a mat-menu-item [matMenuTriggerFor]="groupByMenu">
        Grouper par
      </a>
    </mat-menu>
    <mat-menu #groupByMenu="matMenu" class="card-menu">
      <a mat-menu-item
         *ngFor="let option of groupingOptions"
         (click)="changeGroupBy(option.value)">
        <mat-icon *ngIf="groupBy === option.value" class="material-symbols-outlined">
          check
        </mat-icon>
        <mat-icon class="material-symbols-outlined">
          {{ option.icon }}
        </mat-icon>
        {{ option.label }}
      </a>
    </mat-menu>
  </div>
</app-timeline>
