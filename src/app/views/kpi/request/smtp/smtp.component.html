<div class="kpi-page">
  <!-- ── Barre de résumé ── -->
  <div class="kpi-summary-row">
    <div class="kpi-stat-card">
      <div class="kpi-stat-icon blue">
        <mat-icon class="material-symbols-outlined">swap_horiz</mat-icon>
      </div>
      <div class="kpi-stat-content">
        <span class="kpi-stat-value">{{$globalStatistic.totalRequest | number}}</span>
        <span class="kpi-stat-label">Nombre de Requêtes</span>
      </div>
    </div>
    <div class="kpi-stat-card">
      <div class="kpi-stat-icon red">
        <mat-icon class="material-symbols-outlined">error_outline</mat-icon>
      </div>
      <div class="kpi-stat-content">
        <div class="kpi-stat-value-row">
          <span class="kpi-stat-value">{{$globalStatistic.totalRequestError | number}}</span>
          <span class="kpi-error-badge">
            soit {{$globalStatistic.percentError | number: '1.0-1'}}%
          </span>
        </div>
        <span class="kpi-stat-label">Nombre d'Incidents</span>
      </div>
    </div>
    <div class="kpi-stat-card">
      <div class="kpi-stat-icon purple">
        <mat-icon class="material-symbols-outlined">schedule</mat-icon>
      </div>
      <div class="kpi-stat-content">
        <div class="kpi-stat-value-row">
          <span class="kpi-stat-value">{{$globalStatistic.elapsedPercentile | duration}}</span>
          <span class="kpi-error-badge">
            soit P.95
          </span>
        </div>
        <span class="kpi-stat-label">Temps de réponse</span>
      </div>
    </div>
  </div>

  <!-- ── Grille des charts ── -->
  <div class="kpi-grid">

    <!-- Chart 1 – Répartition par statut -->
    <div class="kpi-chart-card span-4">
      <status-chart
              [chartConfig]="$statusRepartition.chartConfig"
              [data]="$statusRepartition.data"
              [loading]="$statusRepartition.loading"
              [sliceData]="$statusRepartitionSlice.data"
              [queryParams]="params"
              (onChartChange)="onStatusChartChange($event)">
      </status-chart>
    </div>

    <div class="kpi-chart-card">
      <command-chart
              [data]="$commandRepartition.data"
              [loading]="$commandRepartition.loading"
              [queryParams]="params">
      </command-chart>
    </div>

    <div class="kpi-chart-card span-3">
      <performance-chart
              [chartConfig]="$performanceRepartition.chartConfig"
              [data]="$performanceRepartition.data"
              [loading]="$performanceRepartition.loading"
              [sliceData]="$performanceRepartitionSlice.data"
              [queryParams]="params"
              (onChartChange)="onPerformanceChartChange($event)">
      </performance-chart>
    </div>
    <div class="kpi-chart-card span-4">
      <user-chart
              [data]="$userRepartition.data"
              [loading]="$userRepartition.loading"
              [queryParams]="params"></user-chart>
    </div>
    <div class="kpi-chart-card span-4">
      <dependency-chart
              [data]="$dependencyRepartition.data"
              [loading]="$dependencyRepartition.loading"
              [queryParams]="params"></dependency-chart>
    </div>
  </div>
</div>
