<div class="kpi-chart-header">
  <div class="kpi-chart-title-group">
    <span class="kpi-accent-bar purple-bar"></span>
    <mat-icon class="kpi-chart-icon material-symbols-outlined">text_snippet</mat-icon>
    <span class="kpi-chart-title">Media</span>
  </div>
</div>
<div class="kpi-chart-subheader">
  <span class="kpi-chart-unit">{{ subtitle }}</span>
</div>
<div class="kpi-chart-body" >
  <chart type="donut"
         [config]="chartProvider"
         [data]="_data"
         [isLoading]="loading"></chart>
</div>
