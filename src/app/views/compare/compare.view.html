<div class="compare-page">

  <!-- Loading -->
  <div class="compare-loading" *ngIf="!data">
    <mat-spinner diameter="36"></mat-spinner>
  </div>

  <!-- Liste des requêtes comparées -->
  <div class="compare-list" *ngIf="data">
    <div class="compare-item" *ngFor="let item of data">
      <div #graphContainer class="graph-container"></div>
    </div>
  </div>

</div>
